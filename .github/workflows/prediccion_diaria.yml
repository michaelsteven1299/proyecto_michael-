name: Prediccion diaria oro COP

on:
  schedule:
    # 22:00 UTC = despues del cierre del mercado de EEUU (16:00-17:00 hora Este)
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar-prediccion:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas numpy scikit-learn yfinance matplotlib lightgbm xgboost jupyter nbclient nbformat ipykernel

      # La prediccion no sale de un script aparte: se ejecutan los mismos
      # notebooks (00 -> 01 -> 02 -> 04) que un profesor correria en Colab
      # para revisar el proyecto. 04_modelo.ipynb termina con la seccion
      # "Prediccion para el dia siguiente", que es la que alimenta la
      # pagina web.
      - name: Ejecutar 00_descargas.ipynb
        run: python .github/scripts/run_notebook.py src/00_descargas.ipynb

      - name: Ejecutar 01_consolidar.ipynb
        run: python .github/scripts/run_notebook.py src/01_consolidar.ipynb

      - name: Ejecutar 02_limpieza.ipynb
        run: python .github/scripts/run_notebook.py src/02_limpieza.ipynb

      - name: Ejecutar 04_modelo.ipynb (incluye la prediccion del dia siguiente)
        run: python .github/scripts/run_notebook.py src/04_modelo.ipynb

      - name: Generar pagina web (docs/index.html)
        run: python src/06_build_pagina.py

      - name: Commit y push de los resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data/ docs/ src/00_descargas.ipynb src/01_consolidar.ipynb src/02_limpieza.ipynb src/04_modelo.ipynb
          git diff --cached --quiet || git commit -m "Actualizacion diaria: prediccion oro COP $(date -u +%Y-%m-%d)"
          git push

      # El push anterior usa el GITHUB_TOKEN automatico, que no siempre
      # dispara la reconstruccion de Pages por si solo. Por eso se
      # despliega aqui explicitamente con las acciones oficiales de Pages,
      # usando el docs/ que se acaba de generar en este mismo job.
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
